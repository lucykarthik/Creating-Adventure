<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creating Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="adventure">
    <div class="opening-line">
        <span>Some things are better discovered.</span>
    </div>

    <button class="little-key" aria-label="Unlock">
    <span class="key-shaft"></span>
    <span class="key-ring"></span>
</button>

    <div class="unlock-screen"></div>
    <div class="golden-light"></div>

   
<section class="next-scene">
    <p class="unlock-message">Something has been unlocked.</p>

    <button class="continue-hint" type="button">
        Tap to continue <span>↓</span>
    </button>
</section>

<section class="discovery-scene">
    <p>Every adventure begins with a little wonder.</p>

    <button class="discovery-hint" type="button">
        Continue <span>↓</span>
    </button>
</section>


<section class="wish-scene">
    <div class="wish-candle" role="button" tabindex="0" aria-label="Light the candle">
        <div class="candle-flame"></div>
        <div class="candle-body"></div>
    </div>

    <div class="wish-star">✦</div>

    <p class="wish-message">Some wishes are too precious to say aloud.</p>

    <button class="wish-hint" type="button">Light the candle</button>
</section>



</main>

    <script src="script.js"></script>
</body>
</html>
